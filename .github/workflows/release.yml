name: Release

# `v*` のタグを push すると、各 OS のバイナリを作って下書きのリリースに置く。公開は利用者が確かめてから行う。
# このファイルを変えた pull request では、リリースを作らずにビルドだけ試す (macOS が動くのはこのときとリリースだけ。
# 非公開のリポジトリでは macOS の Actions が高いため、PR ごとの CI には入れていない)。
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux は musl で静的にリンクし、glibc の版に左右されないようにする。
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            run: true
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          # macos-latest は arm64 なので、x86_64 は作るだけで動かさない。
          - target: x86_64-apple-darwin
            os: macos-latest
            run: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            run: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # ci.yml と同じく、Rust のバージョンは mise.toml から読む。
      - name: Install Rust
        shell: bash
        run: |
          version=$(sed -n 's/^rust = "\([^"]*\)".*/\1/p' mise.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --target "${{ matrix.target }}"
          rustup default "$version"
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/gtodo/Cargo.toml | head -n 1)
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # タグと Cargo.toml の版が食い違ったまま出さない。
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in crates/gtodo/Cargo.toml ($version)"
              exit 1
            fi
          fi
          echo "name=gtodo-v$version-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --locked --release --package gtodo --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/gtodo
          "$bin" --version
          "$bin" completions bash > /dev/null
      # mise の github バックエンドなどが名前から OS と CPU を選べるよう、ターゲットを名前に入れる。
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=${{ steps.version.outputs.name }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/gtodo" README.md LICENSE "$name/"
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$name/"; fi
          tar -czf "$name.tar.gz" "$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ steps.version.outputs.name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gtodo.exe", README.md, LICENSE $name
          if (Test-Path CHANGELOG.md) { Copy-Item CHANGELOG.md $name }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.name }}.*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # attestations (ビルドの出所の証明) に使う。非公開のリポジトリでは付けない (下の if)。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      # 非公開のリポジトリで attestations を付けるには GitHub Enterprise Cloud が要るため、公開してから付く。
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/gtodo-*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # CHANGELOG.md のその版の節 (`## v0.1.0` から次の `## ` の前まで) をリリースノートにする。
          awk -v head="## v$version" '
            index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md 2>/dev/null || true
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}"
