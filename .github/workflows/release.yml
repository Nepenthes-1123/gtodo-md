name: Release

# 各 OS のバイナリを作って下書きのリリースに置く。公開は利用者が確かめてから行う。始め方は 2 つ:
# - `v*` のタグを push する
# - Actions の画面から main で実行し、作るタグ (`v0.2.0` など) を入れる。ビルドが通った後にタグを付ける
#   (手元にクローンが無くても出せるように)
# このファイルを変えた pull request と、タグを入れずに実行したときは、リリースを作らずにビルドだけ試す
# (テストは ci.yml が macOS を含めて走らせる)。
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.2.0 (must match crates/gtodo/Cargo.toml; run on main). Leave empty to only build."
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 出すリリースのタグ。空ならビルドだけ。入力は式で run に埋め込まず、環境変数で渡す (シェルに解釈させないため)。
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.event_name == 'push' && github.ref_name || '') }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux は musl で静的にリンクし、glibc の版に左右されないようにする。
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            run: true
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          # macos-latest は arm64 なので、x86_64 は作るだけで動かさない。
          - target: x86_64-apple-darwin
            os: macos-latest
            run: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            run: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # ci.yml と同じく、Rust のバージョンは mise.toml から読む。
      - name: Install Rust
        shell: bash
        run: |
          version=$(sed -n 's/^rust = "\([^"]*\)".*/\1/p' mise.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --target "${{ matrix.target }}"
          rustup default "$version"
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/gtodo/Cargo.toml | head -n 1)
          test -n "$version"
          if [[ -n "$TAG" ]]; then
            # タグと Cargo.toml の版が食い違ったまま出さない。
            if [[ "$TAG" != "v$version" ]]; then
              echo "::error::tag $TAG does not match the version in crates/gtodo/Cargo.toml ($version)"
              exit 1
            fi
            # 画面から実行してタグを付けるときは、ビルドの前に確かめる (通らないなら待たせない)。
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              if [[ "$GITHUB_REF" != refs/heads/main ]]; then
                echo "::error::run the release on main (got $GITHUB_REF)"
                exit 1
              fi
              if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
                echo "::error::tag $TAG already exists"
                exit 1
              fi
            fi
          fi
          echo "name=gtodo-v$version-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --locked --release --package gtodo --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/gtodo
          "$bin" --version
          "$bin" completions bash > /dev/null
      # mise の github バックエンドなどが名前から OS と CPU を選べるよう、ターゲットを名前に入れる。
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=${{ steps.version.outputs.name }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/gtodo" README.md LICENSE "$name/"
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$name/"; fi
          tar -czf "$name.tar.gz" "$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ steps.version.outputs.name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gtodo.exe", README.md, LICENSE $name
          if (Test-Path CHANGELOG.md) { Copy-Item CHANGELOG.md $name }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.name }}.*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # attestations (ビルドの出所の証明) に使う。非公開のリポジトリでは付けない (下の if)。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      # 非公開のリポジトリで attestations を付けるには GitHub Enterprise Cloud が要るため、公開してから付く。
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/gtodo-*
      # 画面から実行したときは、ビルドが通ったここでタグを付ける。GITHUB_TOKEN で push したタグは
      # ワークフローを起動しないので、このワークフローが二重に走ることはない。
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          # このジョブだけを再実行した (タグを付けた後に失敗した) ときは、同じコミットを指すタグをそのまま使う。
          existing=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          if [[ -n "$existing" ]]; then
            if [[ "$existing" == "$GITHUB_SHA" ]]; then exit 0; fi
            echo "::error::tag $TAG already exists and points to $existing, not $GITHUB_SHA"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          # CHANGELOG.md のその版の節 (`## v0.1.0` から次の `## ` の前まで) をリリースノートにする。
          # 前後の空行は除く (中の空行は残す)。
          awk -v head="## v$version" '
            index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^[[:space:]]*$/ { if (started) blank++; next }
            found { for (; blank > 0; blank--) print ""; started = 1; print }
          ' CHANGELOG.md > notes.md 2>/dev/null || true
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* --draft --verify-tag --title "Release $TAG" "${notes[@]}"
